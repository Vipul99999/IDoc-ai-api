apiVersion: apps/v1
kind: Deployment
metadata:
  name: intellidoc-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intellidoc-web
  template:
    metadata:
      labels:
        app: intellidoc-web
    spec:
      containers:
        - name: web
          image: intellidoc/web:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATA_ROOT
              value: /data
            - name: RETENTION_DAYS
              value: "30"
---
apiVersion: v1
kind: Service
metadata:
  name: intellidoc-web
spec:
  selector:
    app: intellidoc-web
  ports:
    - port: 80
      targetPort: 3000
